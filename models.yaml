# Models to probe. `reasoning` is optional and provider-specific:
#   gemini:    off | low | medium | high   (off => thinking_budget=0)
#   openai:    minimal | low | medium | high
#   anthropic: (ignored for now)
# Omit `reasoning` to use the provider default.
models:
  - name: gemini-3.8-flash
    provider: gemini
    model: gemini-3.8-flash
  - name: gemini-3.8-flash-low
    provider: gemini
    model: gemini-3.8-flash
    reasoning: low
  - name: gemini-3.8-flash-off
    provider: gemini
    model: gemini-3.8-flash
    reasoning: "off"
  - name: gemini-3.5-flash-lite
    provider: gemini
    model: gemini-3.5-flash-lite
  - name: gpt-5.4-mini
    provider: openai
    model: gpt-5.4-mini
