# Models to probe. `reasoning` is optional and provider-specific:
#   gemini:    off | low | medium | high   (off => thinking_budget=0)
#   openai:    minimal | low | medium | high
#   anthropic: (ignored for now)
# Omit `reasoning` to use the provider default.
#
# Note: gemini-3.8-flash reasoning=low/off was tested and did NOT reduce latency
# (it stays ~3.5-4.7s vs ~0.7s for the lite model), so those variants were dropped.
models:
  - name: gemini-3.5-flash-lite
    provider: gemini
    model: gemini-3.5-flash-lite
  - name: gpt-5.4-mini
    provider: openai
    model: gpt-5.4-mini
  - name: gemini-3.8-flash
    provider: gemini
    model: gemini-3.8-flash
